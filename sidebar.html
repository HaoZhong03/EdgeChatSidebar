<!doctype html>
<html lang="zh-CN" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeepSeek Chat</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css">
    <link rel="stylesheet" href="sidebar.css">
  </head>
  <body>
    <main class="app">
      <section id="settingsPanel" class="settings" aria-label="DeepSeek 设置" aria-modal="true" role="dialog">
        <div class="settings-dialog">
          <div class="settings-titlebar">
            <h2>设置</h2>
            <button id="closeSettingsButton" class="icon-button" type="button" aria-label="关闭设置" title="关闭设置">
              <span aria-hidden="true">×</span>
            </button>
          </div>
          <label class="field">
            <span>API Key</span>
            <input id="apiKeyInput" type="password" autocomplete="off" placeholder="sk-...">
          </label>
          <label class="field">
            <span>模型</span>
            <select id="modelSelect">
              <option value="deepseek-v4-flash">deepseek-v4-flash</option>
              <option value="deepseek-v4-pro">deepseek-v4-pro</option>
            </select>
          </label>
          <label class="field">
            <span>主题</span>
            <select id="themeSelect">
              <option value="system">跟随系统</option>
              <option value="light">浅色</option>
              <option value="dark">深色</option>
            </select>
          </label>
          <label class="field">
            <span>系统提示词</span>
            <textarea id="systemPromptInput" rows="3" placeholder="例如：用简洁中文回答。"></textarea>
          </label>
          <div class="settings-actions">
            <button id="saveSettingsButton" type="button">保存设置</button>
            <button id="clearChatButton" type="button" class="secondary">清空会话</button>
          </div>
        </div>
      </section>

      <section id="historyPanel" class="history" aria-label="历史对话" aria-modal="true" role="dialog">
        <div class="history-dialog">
          <div class="settings-titlebar">
            <h2>历史对话</h2>
            <button id="closeHistoryButton" class="icon-button" type="button" aria-label="关闭历史对话" title="关闭历史对话">
              <span aria-hidden="true">×</span>
            </button>
          </div>
          <button id="newChatButton" class="new-chat-button" type="button">新建对话</button>
          <div id="historyList" class="history-list" aria-label="历史对话列表"></div>
        </div>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="chatForm" class="composer">
        <button id="expandComposerButton" class="icon-button composer-toggle" type="button" aria-label="展开输入框" title="展开输入框">
          <span aria-hidden="true">^</span>
        </button>
        <textarea id="messageInput" rows="2" placeholder="输入你的问题..." required></textarea>
        <button id="sendButton" type="submit">发送</button>
      </form>

      <div class="statusbar" aria-label="状态栏">
        <p id="statusText">未连接</p>
        <div class="status-actions">
          <button id="historyButton" class="icon-button" type="button" aria-label="历史对话" title="历史对话">
            <span aria-hidden="true">📄</span>
          </button>
          <button id="settingsButton" class="icon-button" type="button" aria-label="设置" title="设置">
            <span aria-hidden="true">⚙️</span>
          </button>
        </div>
      </div>
    </main>

    <script src="vendor/katex/katex.min.js"></script>
    <script src="sidebar.js"></script>
  </body>
</html>
